---
layout: default
---

<main>
  <div class="page-wrap">

    <a href="{{ '/projects/' | relative_url }}" class="back-link">← All projects</a>

    <header class="post-header">
      <div class="post-header-meta">
        {% for t in page.tags %}
        <span class="tag">{{ t }}</span>
        {% endfor %}
      </div>
      <h1>{{ page.title }}</h1>
      {% if page.summary %}<p class="lead dim">{{ page.summary }}</p>{% endif %}
    </header>

    <div class="content-wrap">
      <div class="post-body">
        {{ content }}
      </div>
    </div>

  </div>
</main>
