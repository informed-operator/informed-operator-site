<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
</head>
<body>

<nav class="site-nav">
  <div class="inner">
    <a href="{{ '/' | relative_url }}" class="nav-brand">
      Informed<span class="slash">/</span><span class="accent">Operator</span>
    </a>
    <ul class="nav-links">
      <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
      <li><a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>About</a></li>
      <li><a href="{{ '/writing/' | relative_url }}" {% if page.url contains '/writing' %}class="active"{% endif %}>Writing</a></li>
      <li><a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}class="active"{% endif %}>Projects</a></li>
    </ul>
  </div>
</nav>

{{ content }}

<footer class="site-footer">
  <div class="inner">
    <span class="footer-left">© {{ 'now' | date: '%Y' }} Informed Operator</span>
    <ul class="footer-links">
      <li><a href="{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a></li>
    </ul>
  </div>
</footer>

</body>
</html>
