---
layout: default
---

<main>
  <div class="page-wrap">

    <a href="{{ '/writing/' | relative_url }}" class="back-link">← All writing</a>

    <header class="post-header">
      <div class="post-header-meta">
        <span class="post-tag {{ page.tag }}">{{ page.tag | capitalize }}</span>
        <span class="post-date-full">{{ page.date | date: "%B %-d, %Y" }}</span>
      </div>
      <h1>{{ page.title }}</h1>
      {% if page.excerpt %}<p class="lead dim">{{ page.excerpt }}</p>{% endif %}
    </header>

    <div class="content-wrap">
      <div class="post-body">
        {{ content }}
      </div>
    </div>

  </div>
</main>
